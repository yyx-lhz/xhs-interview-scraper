[project]
name = "xhs-interview-scraper"
version = "0.1.0"
description = "Scrape Xiaohongshu interview-experience (面经) posts for major Chinese internet companies."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1.0",
    "typer>=0.12.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
xhs = "xhs_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xhs_scraper"]
